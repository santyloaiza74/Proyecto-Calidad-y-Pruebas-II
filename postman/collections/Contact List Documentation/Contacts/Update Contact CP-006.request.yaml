$kind: http-request
url: https://thinking-tester-contact-list.herokuapp.com/contacts/{{contactId}}
method: PUT
headers:
  Authorization: Bearer {{tokenAuth}}
body:
  type: json
  content: |-
    {
        "firstName": "Amy",
        "lastName": "Miller",
        "birthdate": "1992-02-02",
        "email": "amiller@fake.com",
        "phone": "8005554242",
        "street1": "13 School St.",
        "street2": "Apt. 5",
        "city": "Washington",
        "stateProvince": "QC",
        "postalCode": "A1A1A1",
        "country": "Canada"
    }
scripts:
  - type: afterResponse
    code: "pm.test(\"CP-006: Reemplazo total de la entidad contacto (PUT)\",function(){\r

      \    pm.response.to.have.status(200)\r

      \    pm.expect(pm.response.json().firstName).to.not.eql(pm.collectionVariables.get(\"contactFirstName\"))\r

      \    pm.expect(pm.response.json().lastName).to.not.eql(pm.collectionVariables.get(\"contactLastName\"))\r

      \    pm.expect(pm.response.json().birthdate).to.not.eql(pm.collectionVariables.get(\"contactBirthdate\"))\r

      \    pm.expect(pm.response.json().email).to.not.eql(pm.collectionVariables.get(\"contactEmail\"))\r

      \    pm.expect(pm.response.json().phone).to.not.eql(pm.collectionVariables.get(\"contactPhone\"))\r

      \    pm.expect(pm.response.json().street1).to.not.eql(pm.collectionVariables.get(\"contactStreet1\"))\r

      \    pm.expect(pm.response.json().street2).to.not.eql(pm.collectionVariables.get(\"contactStreet2\"))\r

      \    pm.expect(pm.response.json().city).to.not.eql(pm.collectionVariables.get(\"contactCity\"))\r

      \    pm.expect(pm.response.json().stateProvince).to.not.eql(pm.collectionVariables.get(\"contactStateProvince\"))\r

      \    pm.expect(pm.response.json().postalCode).to.not.eql(pm.collectionVariables.get(\"contactPostalCode\"))\r

      \    pm.expect(pm.response.json().country).to.not.eql(pm.collectionVariables.get(\"contactCountry\"))\r

      })"
    language: text/javascript
examples: .resources/Update Contact CP-006.resources/examples
order: 6000
