$kind: http-request
url: https://thinking-tester-contact-list.herokuapp.com/contacts/{{contactId}}
method: DELETE
headers:
  Authorization: Bearer {{tokenAuth}}
scripts:
  - type: afterResponse
    code: pm.collectionVariables.unset("contactId")
    language: text/javascript
examples: ./.resources/Delete Contact.resources/examples
order: 8000
