$kind: http-request
url: https://thinking-tester-contact-list.herokuapp.com/contacts
method: POST
headers:
  Authorization: Bearer {{tokenAuth}}
body:
  type: json
  content: |-
    {
        "firstName": "{{$randomFirstName}}",
        "lastName": "{{$randomLastName}}",
        "birthdate": "2003-02-11",
        "email": "{{$randomEmail}}",
        "phone": "8005555555",
        "street1": "1 Main St.",
        "street2": "Apartment A",
        "city": "Anytown",
        "stateProvince": "KS",
        "postalCode": "12345",
        "country": "USA"
    }
scripts:
  - type: afterResponse
    code: "pm.collectionVariables.set(\"contactId\", pm.response.json()._id);\r

      pm.collectionVariables.set(\"contactFirstName\", pm.response.json().firstName);\r

      pm.collectionVariables.set(\"contactLastName\", pm.response.json().lastName);\r

      pm.collectionVariables.set(\"contactBirthdate\", pm.response.json().birthdate);\r

      pm.collectionVariables.set(\"contactEmail\", pm.response.json().email);\r

      pm.collectionVariables.set(\"contactPhone\", pm.response.json().phone);\r

      pm.collectionVariables.set(\"contactStreet1\", pm.response.json().street1);\r

      pm.collectionVariables.set(\"contactStreet2\", pm.response.json().street2);\r

      pm.collectionVariables.set(\"contactCity\", pm.response.json().city);\r

      pm.collectionVariables.set(\"contactStateProvince\", pm.response.json().stateProvince);\r

      pm.collectionVariables.set(\"contactPostalCode\", pm.response.json().postalCode);\r

      pm.collectionVariables.set(\"contactCountry\", pm.response.json().country);\r\n"
    language: text/javascript
examples: .resources/Add Contact.resources/examples
order: 2000
