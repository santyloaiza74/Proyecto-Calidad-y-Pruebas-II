$kind: http-request
name: Add Contact CP-011
url: https://thinking-tester-contact-list.herokuapp.com/contacts
method: POST
headers:
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
        "firstName": "John",
        "lastName": "Doe",
        "birthdate": "25-12-1995",
        "email": "jdoe@fake.com",
        "phone": "8005555555",
        "street1": "1 Main St.",
        "street2": "Apartment A",
        "city": "Anytown",
        "stateProvince": "KS",
        "postalCode": "12345",
        "country": "USA"
    }
scripts:
  - type: afterResponse
    code: "pm.test(\"CP-011 Creación de contacto con fecha de nacimiento en formato
      no ISO 8601\", function () {\r

      \    pm.response.to.have.status(400);\r

      });"
    language: text/javascript
examples: .resources/Add Contact CP-011-1.resources/examples
order: 1000
