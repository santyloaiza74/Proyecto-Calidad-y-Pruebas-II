$kind: http-example
request:
  url: https://thinking-tester-contact-list.herokuapp.com/contacts/{{contactId}}
  method: PATCH
  headers:
    Authorization: Bearer {{token}}
  body:
    type: json
    content: |-
      {
          "firstName": "Anna"
      }
