$kind: http-request
name: Add User
url: https://thinking-tester-contact-list.herokuapp.com/users
method: POST
headers:
  - key: Authorization
    value: Bearer {{token}}
    disabled: true
    $type: |-
      {
        "type": "",
        "format": "",
        "required": false,
        "deprecated": false,
        "default": "",
        "enum": [],
        "pattern": "",
        "minLength": "",
        "maxLength": "",
        "minItems": "",
        "maxItems": "",
        "minimum": "",
        "maximum": "",
        "uniqueItems": false
      }
body:
  type: json
  content: |-
    {
        "firstName": "{{Nombre}}",
        "lastName": "{{Apellido}}",
        "email": "{{Correo}}",
        "password": "{{Contraseña}}"
    }
scripts:
  - type: afterResponse
    code: "let data = pm.response.json()\r

      let user = data.user\r

      pm.collectionVariables.set(\"Nombre\", user.firstName)\r

      pm.collectionVariables.set(\"Apellido\", user.lastName)\r

      pm.collectionVariables.set(\"Correo\", user.email)"
    language: text/javascript
examples: ./.resources/Add User-1.resources/examples
order: 1000
