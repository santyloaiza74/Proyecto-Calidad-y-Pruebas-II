$kind: http-request
url: https://thinking-tester-contact-list.herokuapp.com/users
method: POST
headers:
  - key: Authorization
    value: Bearer {{token}}
    disabled: true
body:
  type: json
  content: |-
    {
        "firstName": "{{$randomUserName}}",
        "lastName": "{{$randomLastName}}",
        "email": "{{$randomEmail}}",
        "password": "{{$randomPassword}}"
    }
scripts:
  - type: afterResponse
    code: "pm.test(\" Registro de usuario público\", function () {\r

      \    pm.response.to.have.status(201);\r

      });"
    language: text/javascript
settings: {}
examples: ./.resources/Add User.resources/examples
order: 1000
