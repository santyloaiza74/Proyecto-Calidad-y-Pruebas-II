$kind: http-request
description: The GET User Profile operation is not available through the UI.
url: https://thinking-tester-contact-list.herokuapp.com/users/me
method: GET
headers:
  Authorization: Bearer {{tokenAuth}}
scripts:
  - type: afterResponse
    code: "pm.test(\"CP-005 Consulta de información del perfil de usuario autenticado\", function () {\r

      \    pm.response.to.have.status(200);\r

      \    pm.expect(pm.response.json().firstName).to.eql(pm.collectionVariables.get(\"Nombre\"));\r

      \    pm.expect(pm.response.json().lastName).to.eql(pm.collectionVariables.get(\"Apellido\"));\r

      \    pm.expect(pm.response.json().email).to.eql(pm.collectionVariables.get(\"Correo\"));\r

      \    pm.expect(pm.response).to.not.have.property(\"password\")\r

      });"
    language: text/javascript
examples: .resources/Get User Profile CP-005.resources/examples
order: 4000
