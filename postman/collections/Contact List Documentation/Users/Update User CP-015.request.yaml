$kind: http-request
description: The PATCH Update User operation is not available through the UI.
url: https://thinking-tester-contact-list.herokuapp.com/users/me
method: PATCH
headers:
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
        "firstName": "{{$randomFirstName}}",
        "lastName": "{{$randomLastName}}",
        "email": "pearline_legros50@hotmail.com"
    }
scripts:
  - type: afterResponse
    code: "pm.test(\"CP-015 Actualización de perfil con duplicidad de correo
      electrónico\", function(){\r

      \    pm.response.to.have.status(400);\r

      })"
    language: text/javascript
examples: ./.resources/Update User CP-015.resources/examples
order: 7000
